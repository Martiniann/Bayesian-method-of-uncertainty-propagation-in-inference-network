name: "Bayesian Analysis Report"

on:
  push:
    branches: ["**"]
    paths:
      - "main.py"
      - "generate_report.py"
      - "data*.txt"
      - ".github/workflows/bayesian-report.yml"
  pull_request:
    paths:
      - "main.py"
      - "generate_report.py"
      - "data*.txt"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset(s) to include (all / data1 / data2 / data3)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  generate-report:
    name: "Run Bayesian Analysis & Generate Report"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install system dependency for pydot (Graphviz) ────────────────────
      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      # ── 4. Install Python dependencies ───────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy anytree pydot

      # ── 5. Run report generator ───────────────────────────────────────────────
      - name: Generate Bayesian analysis report
        run: |
          python generate_report.py --output report.md --github-summary

      # ── 6. Show report in logs ────────────────────────────────────────────────
      - name: Print report to log
        run: cat report.md

      # ── 7. Upload report + tree images as artifacts ───────────────────────────
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bayesian-report-${{ github.run_number }}
          path: |
            report.md
            data*_tree.png
            data*_tree.dot
          if-no-files-found: warn
          retention-days: 30

      # ── 8. Annotate pull requests with a summary comment ─────────────────────
      - name: Post summary annotation
        if: always()
        run: |
          echo "### ✅ Bayesian Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded: \`bayesian-report-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Download the report from the **Actions → Artifacts** panel." >> $GITHUB_STEP_SUMMARY

